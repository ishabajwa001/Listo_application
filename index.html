<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listo | Premium To-Do Experience</title>
  <meta name="description"
    content="A premium, glassmorphic to-do list application for enhanced productivity and focus." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <div class="background-container">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <main class="todo-container">
      <header>
        <div class="header-top">
          <div class="header-info">
            <h1>Listo</h1>
            <p id="current-date" class="date-display"></p>
          </div>
          <div class="progress-container">
            <div class="progress-bar-wrapper">
              <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
            <span id="progress-text">0% Complete</span>
          </div>
        </div>
        <p class="subtitle">Organize your thoughts, elevate your life.</p>
      </header>

      <section class="input-section">
        <form id="todo-form">
          <div class="input-wrapper">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" />
            <button type="submit" id="add-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
        </form>
      </section>

      <section class="filters">
        <button class="filter-btn active" data-filter="all">All Tasks</button>
        <button class="filter-btn" data-filter="active">Active Only</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </section>

      <section class="tasks-section">
        <ul id="todo-list">
          <!-- Tasks will be injected here -->
        </ul>
      </section>

      <footer class="stats">
        <span id="items-left">0 tasks remaining</span>
        <button id="clear-completed" class="clear-btn">Clear Completed</button>
      </footer>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
